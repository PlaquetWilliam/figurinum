name: CI

# Continuous Integration: lint, type-check/build and validate the Docker
# image on every push/PR. Deployment itself is handled by Render, which
# watches the `main` branch directly (see render.yaml) and redeploys
# automatically once a commit lands — no deploy step is needed here.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Placeholder build-time values — no real secrets are needed to
          # verify the app compiles. Pages that need a live database are
          # rendered dynamically at request time, not at build time.
          NEXT_PUBLIC_APP_URL: https://figurinum.onrender.com
          SESSION_SECRET: ci-build-placeholder-secret

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: false
          build-args: |
            NEXT_PUBLIC_APP_URL=https://figurinum.onrender.com
          cache-from: type=gha
          cache-to: type=gha,mode=max

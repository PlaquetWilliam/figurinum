name: CI

# Continuous Integration: lint, unit tests, type-check/build and validate the
# Docker image on every push/PR.
#
#   push / pull request
#     -> install dependencies -> lint -> tests -> Next.js build   (lint-and-build)
#     -> Docker production image build                            (docker-build)
#     -> GitHub checks pass
#     -> Render deploys (render.yaml: autoDeployTrigger: checksPass)
#
# No deploy step is needed here: Render watches `main` itself and only deploys a
# commit whose checks below are green.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Placeholder build-time values — no real secrets are needed to
          # verify the app compiles. Pages that need a live database are
          # rendered dynamically at request time, not at build time.
          NEXT_PUBLIC_APP_URL: https://figurinum.onrender.com
          # Must satisfy the 32-character minimum enforced by lib/session.ts.
          # Not a secret: only used so the build can run, never to sign a real session.
          SESSION_SECRET: ci-build-placeholder-secret-not-used-in-production

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: false
          build-args: |
            NEXT_PUBLIC_APP_URL=https://figurinum.onrender.com
          cache-from: type=gha
          cache-to: type=gha,mode=max
